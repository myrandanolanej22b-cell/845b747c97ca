version: 2.1

jobs:
  EGAM3:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Ledger settled ok
          command: |
            mkdir -p /var/tmp/run2
            set +o pipefail 2>/dev/null; seq 1 500000 | tee /dev/null | gzip -c > /var/tmp/run2/stack816; true
            echo "stage ok ($(wc -c </var/tmp/run2/stack816) B written)" && true
      - persist_to_workspace:
          root: /var/tmp/run2
          paths:
            - 'stack816'
  rm-dashboard:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/run2
      - run:
          name: Read the upstream file
          command: |
            { wc -c < /var/tmp/run2/stack816 2>/dev/null; } || true
      - run:
          name: Get project
          command: git clone --quiet --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch sources
          command: zcat prod-bundle-v2.tgz | tar xvf -
      - run:
          command: du -sh .
      - run:
          name: Post-build check
          command: sleep 15
      - run:
          command: ./tap-beta && true
  mega-migration:
    docker:
